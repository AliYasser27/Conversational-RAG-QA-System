name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight verification tools
        run: python -m pip install --upgrade pip && python -m pip install pyyaml ruff

      - name: Lint
        run: python -m ruff check .

      - name: Byte-compile
        run: python -m compileall -q app.py settings.py engines rag tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v
