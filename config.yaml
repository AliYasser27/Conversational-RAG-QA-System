# Runtime configuration. No secrets belong in this file.
# Environment overrides: RAG_CONFIG_PATH, RAG_LLM_MODEL, RAG_TEMPERATURE,
# RAG_RETRIEVAL_K, RAG_EMBEDDINGS_MODEL.

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.3

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2

chunking:
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  search_type: mmr          # "mmr" for diverse results, "similarity" for pure cosine
  k: 4                      # chunks passed to the answer prompt
  fetch_k: 20               # candidate pool used by MMR
  lambda_mult: 0.5          # 1 = relevance only, 0 = maximum diversity

# Optional second-stage reranking. Disabled by default because it downloads a
# cross-encoder model on first use. Enable it for higher precision at the cost
# of latency.
reranking:
  enabled: false
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 4

vector_store:
  collection_name: pdf_collection
  persist_directory: ./chroma_db
